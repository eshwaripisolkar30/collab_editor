<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — CodeCollab Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .error-wrap{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:30px;
        }
        .error-code{
            font-size:110px;
            font-weight:800;
            background:linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip:text;
            background-clip:text;
            color:transparent;
            line-height:1;
        }
        .error-wrap p{
            color:var(--muted);
            margin:18px 0 34px;
            font-size:17px;
        }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="error-code">404</div>
        <p>{{ message or "The page you are looking for does not exist." }}</p>
        <a href="/" class="btn-primary">Back to Home</a>
    </div>
</body>
</html>
